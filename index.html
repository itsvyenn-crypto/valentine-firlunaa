<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>For Love Firlunaaaa 💗</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      max-width: 420px;
      text-align: center;
      animation: fadeIn 2s;
      z-index: 2;
    }

    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      margin-bottom: 15px;
    }

    h1 { font-size: 28px; }

    h2 {
      font-size: 22px;
      color: #ffe6f0;
      min-height: 28px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
    }

    .heart {
      font-size: 45px;
      animation: beat 1s infinite;
      margin: 10px 0;
    }

    button {
      margin-top: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      background: #ff4f9a;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff2f85;
      transform: scale(1.05);
    }

    footer {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.85;
    }

    .tap-text {
      position: fixed;
      bottom: 25px;
      font-size: 14px;
      opacity: 0.9;
      animation: blink 1.5s infinite;
      z-index: 3;
    }

    .falling-heart {
      position: fixed;
      top: -20px;
      font-size: 18px;
      animation: fall linear infinite;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Musik -->
  <audio id="music" loop>
    <source src="vyn.mp3" type="audio/mpeg">
  </audio>

  <div class="tap-text" id="tapText">
    Tap layar untuk memulai 💗
  </div>

  <div class="card">
    <img src="ven.jpg" alt="Foto Love Firlunaaaa">

    <h1>Happy Valentine 💕</h1>
    <h2 id="typingText"></h2>

    <div class="heart">❤️</div>

    <p>
      Setiap hari bersamamu selalu terasa spesial.  
      Terima kasih sudah menjadi rumah ternyaman bagiku.  
      Aku akan selalu memilih kamu, hari ini dan seterusnya 🤍
    </p>

    <button onclick="alert('Aku sayang kamu, love firlunaaaa 💗')">
      Klik kalau kamu sayang aku 😳
    </button>

    <footer>
      — Dari aku, yang paling bucin ke kamu —
    </footer>
  </div>

  <script>
    let sudahPlay = false;
    const music = document.getElementById("music");
    const text = "love firlunaaaa 💗";
    let index = 0;

    function typingEffect() {
      if (index < text.length) {
        document.getElementById("typingText").innerHTML += text.charAt(index);
        index++;
        setTimeout(typingEffect, 120);
      }
    }

    document.body.addEventListener("click", function () {
      if (!sudahPlay) {
        sudahPlay = true;

        document.getElementById("tapText").style.display = "none";

        // Musik fade-in
        music.volume = 0;
        music.play();
        let volume = 0;
        const fade = setInterval(() => {
          if (volume < 1) {
            volume += 0.05;
            music.volume = volume;
          } else {
            clearInterval(fade);
          }
        }, 200);

        // Mulai typing nama
        typingEffect();

        // Hujan hati
        setInterval(createHeart, 300);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "falling-heart";
      heart.innerHTML = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }
  </script>

</body>
</html>
